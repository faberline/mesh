# <HANDWRITE gap="mesh-cli-shell-scaffold" tracker="#1970" reason="Initial Mesh Rust crate manifest: CLI shell only, no graph engine yet.">
[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.4.13"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/mesh"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "mesh - relationship/property-graph service"
build = "build.rs"

[lib]
name = "mesh"
path = "src/lib.rs"

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

# Shared standard CLI ops (llm / upgrade / issue). `online` is on so the
# released binary can self-update and file issues.
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", features = ["online"] }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# </HANDWRITE>
